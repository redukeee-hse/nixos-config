[dmenu]
dmenu_command = rofi -i -no-config -theme /home/configuser/.config/rofi/wifi.rasi
active_chars = ✓
highlight = True
wifi_chars = ▂▄▆█
format = {name}  {sec}  {signal}%%  {bars}
list_saved = False
prompt =   Wi-Fi

[dmenu_passphrase]
obscure = True

[editor]
terminal = alacritty
gui_if_available = True
gui = nm-connection-editor
