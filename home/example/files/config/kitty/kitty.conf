# Kitty replaces Alacritty: it draws images in the terminal (fastfetch shows
# the real NixOS logo), has tabs and splits, ligatures and remote control.
# The look matches the old Alacritty setup: translucent, borderless, pywal
# colours (pywal also repaints open windows through its escape sequences).
include ~/.cache/wal/colors-kitty.conf

font_family      JetBrainsMono Nerd Font Mono
font_size        11
modify_font      cell_height 110%

background_opacity   0.65
background_blur      0
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0
placement_strategy top-left

cursor_shape       beam
# No cursor trail: it stretches the cursor into a streak on fast moves.
cursor_trail 0
# Draw sooner after each key press (defaults 10 ms and 3 ms).
repaint_delay 6
input_delay   1
scrollback_lines   20000
enable_audio_bell  no
copy_on_select     clipboard
strip_trailing_spaces smart

# fish is the interactive shell; scripts and the login shell stay on bash.
shell fish

tab_bar_edge       bottom
tab_bar_style      powerline
tab_powerline_style slanted
tab_title_template "{index} {title}"

# kitty @ … from scripts (e.g. new tab in the current directory).
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}

map f11              toggle_fullscreen
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+l     next_layout
