# Start with the current pywal palette so a new window does not flash the
# default colors before .bashrc replays the pywal sequences.
[general]
import = ["~/.cache/wal/colors-alacritty.toml"]

[colors]
draw_bold_text_with_bright_colors = true

[env]
TERM = "xterm-256color"

[font]
size = 11

[font.bold]
family = "JetBrainsMono Nerd Font Mono"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"

[font.normal]
family = "JetBrainsMono Nerd Font Mono"

[font.offset]
y = -4

[[keyboard.bindings]]
action = "ToggleFullscreen"
key = "F11"

[window]
decorations = "None"
opacity = 0.65

[window.padding]
x = 14
y = 14
