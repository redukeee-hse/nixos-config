$fileManager=nautilus


# Custom apps
source = ~/.config/hyprland/telegram.conf
source = ~/.config/hyprland/nautilus.conf
source = ~/.config/hyprland/keyboard.conf

# End Custom apps

$home=$HOME
$mainMod=SUPER
$VsCodeEditor = ~/.local/share/custom/bin/vscode-current-dir.sh
$terminal=~/.local/share/custom/bin/term.sh
animations {
  bezier=easeOutQuint,0.23,1,0.32,1
  bezier=easeInOutCubic,0.65,0.05,0.36,1
  bezier=linear,0,0,1,1
  bezier=almostLinear,0.5,0.5,0.75,1.0
  bezier=quick,0.15,0,0.1,1
  animation=global, 1, 10, default
  animation=border, 1, 5.39, easeOutQuint
  animation=windows, 1, 4.79, easeOutQuint
  animation=windowsIn, 1, 4.1, easeOutQuint, popin 87%
  animation=windowsOut, 1, 1.49, linear, popin 87%
  animation=fadeIn, 1, 1.73, almostLinear
  animation=fadeOut, 1, 1.46, almostLinear
  animation=fade, 1, 3.03, quick
  animation=layers, 1, 3.81, easeOutQuint
  animation=layersIn, 1, 4, easeOutQuint, fade
  animation=layersOut, 1, 1.5, linear, fade
  animation=fadeLayersIn, 1, 1.79, almostLinear
  animation=fadeLayersOut, 1, 1.39, almostLinear
  animation=workspaces, 1, 1.94, almostLinear, fade
  animation=workspacesIn, 1, 1.21, almostLinear, fade
  animation=workspacesOut, 1, 1.94, almostLinear, fade
  enabled=yes, please :)
}

cursor {
  inactive_timeout=3
  no_warps=false
}

decoration {
  blur {
    enabled=true
    passes=3
    size=6
    vibrancy=0.17
  }

  shadow {
    color=rgba(1a1a1a88)
    enabled=true
    range=4
    render_power=3
  }
  active_opacity=1.000000
  inactive_opacity=1.000000
  rounding=10
  rounding_power=2
}


dwindle {
  preserve_split=true
}

general {
  allow_tearing=false
  border_size=2
  col.active_border=rgba(ccccccee)
  col.inactive_border=rgba(00000000)
  gaps_in=5
  gaps_out=5
  layout=dwindle
  resize_on_border=true
}

input {
  follow_mouse=1
  # kb_layout, kb_variant and kb_options: ~/.config/hyprland/keyboard.conf
  kb_model=
  kb_rules=
  sensitivity=0.2
  touchpad {
    natural_scroll=true
  }
}

master {
  new_status=master
}

misc {
  disable_hyprland_logo=true
  force_default_wallpaper=-1
}

xwayland {
  force_zero_scaling=true
}



### STARTUPS

exec-once=$home/.local/share/custom/bin/waybar-run.sh
exec-once=alacritty --daemon
exec-once=~/.local/share/custom/bin/session-start.sh
# Recovers last background when hyprland starts
exec-once=$home/.local/share/custom/bin/set-wallpaper.sh $home/.config/current/Wallpapers/Picture.png
exec-once=swaync
exec-once=qs
exec-once=$home/.local/share/custom/bin/tray-toggle.sh start
exec-once=$home/.local/share/custom/bin/sync-sddm-theme.sh

#### END OF STARTUPS 


#### CUSTOM BINDS

# Screenshots/recording
bind=, Print, exec, grim -g "$(slurp)" - | wl-copy
bind=SHIFT, Print, exec, grim - | wl-copy
bind=$mainMod, Print, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png
bind=$mainMod SHIFT, Print, exec, mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

# Launcher (rofi) and power menu (Quickshell), styled after github.com/43PR/dotfiles
bind=$mainMod, escape, exec, qs ipc call powermenu toggle
bind=$mainMod MOD5, escape, exec, $home/.local/share/custom/bin/power-profile.sh toggle
bind=$mainMod, space, exec, pkill -x rofi || rofi -show drun
bind=$mainMod, N, exec, swaync-client -t -sw
bind=$mainMod, T, exec, $home/.local/share/custom/bin/tray-toggle.sh

# Browser
bind=$mainMod, B, exec, zen-beta

# Settings panel and wallpaper picker (Quickshell)
bind=$mainMod, I, exec, qs ipc call settings toggle
bind=$mainMod, W, exec, qs -n -p ~/.config/quickshell/hyprquickpaper

# Background cycling
bind=$mainMod CTRL, space, exec, qs -n -p ~/.config/quickshell/hyprquickpaper
bind=$mainMod CTRL SHIFT, space, exec, $home/.local/share/custom/bin/cycle-moving-background.sh

#Terminal tools and widgets
bind=$mainMod, V, exec, $VsCodeEditor
bind=$mainMod, Q, exec, $terminal --class=FloatingTermS -e bash -i -c 'fastfetch; exec bash'
bind=MOD5, comma, togglespecialworkspace, Calculator
bind=$mainMod, return, exec, $terminal --working-directory=$home

# Window management
bind=$mainMod, M, fullscreen, 1
bind=ALT, TAB, cyclenext
bind=$mainMod, H, togglespecialworkspace, magic
bind=$mainMod SHIFT, H, movetoworkspace, special:magic
bind=$mainMod, Y, togglespecialworkspace, spotify
bind=$mainMod, right, resizeactive, 200 0
bind=$mainMod, left, resizeactive, -200 0
bind=$mainMod SHIFT, left, movewindow, l
bind=$mainMod SHIFT, right, movewindow, r
bind=$mainMod SHIFT, up, movewindow, u
bind=$mainMod SHIFT, down, movewindow, d
bind=$mainMod, F, exec, $fileManager
bind=$mainMod, TAB, exec, $terminal --working-directory=$home

# Brightness stuff
bindel=, XF86MonBrightnessDown, exec, $home/.local/share/custom/bin/brightness-osd.sh down
bindel=, XF86MonBrightnessUp, exec, $home/.local/share/custom/bin/brightness-osd.sh up


# Audio stuff
bindrl=,XF86AudioRaiseVolume, exec, $home/.local/share/custom/bin/volume-osd.sh up
bindrl=,XF86AudioLowerVolume, exec, $home/.local/share/custom/bin/volume-osd.sh down
bindrl=,XF86AudioMute, exec, $home/.local/share/custom/bin/volume-osd.sh mute
bindrl=,XF86AudioMicMute, exec, $home/.local/share/custom/bin/mic-osd.sh

### END OF CUSTOM BINDS


# bind=$mainMod, V, togglefloating, 
# bind=$mainMod, J, togglesplit,
bind=$mainMod, 1, workspace, 1
bind=$mainMod, 2, workspace, 2
bind=$mainMod, 3, workspace, 3
bind=$mainMod, 4, workspace, 4
bind=$mainMod, 5, workspace, 5
bind=$mainMod, 6, workspace, 6
bind=$mainMod, 7, workspace, 7
bind=$mainMod, 8, workspace, 8
bind=$mainMod, 9, workspace, 9
bind=$mainMod, 0, workspace, 10
bind=$mainMod SHIFT, 1, movetoworkspace, 1
bind=$mainMod SHIFT, 2, movetoworkspace, 2
bind=$mainMod SHIFT, 3, movetoworkspace, 3
bind=$mainMod SHIFT, 4, movetoworkspace, 4
bind=$mainMod SHIFT, 5, movetoworkspace, 5
bind=$mainMod SHIFT, 6, movetoworkspace, 6
bind=$mainMod SHIFT, 7, movetoworkspace, 7
bind=$mainMod SHIFT, 8, movetoworkspace, 8
bind=$mainMod SHIFT, 9, movetoworkspace, 9
bind=$mainMod SHIFT, 0, movetoworkspace, 10
bind=$mainMod, mouse_down, workspace, e+1
bind=$mainMod, mouse_up, workspace, e-1
# Closes the settings panel when it is open (it is a layer, not a window), otherwise the focused window
binde=$mainMod, R, exec, $home/.local/share/custom/bin/close-active.sh
bindl=, XF86AudioNext, exec, playerctl next
bindl=, XF86AudioPause, exec, playerctl play-pause
bindl=, XF86AudioPlay, exec, playerctl play-pause
bindl=, XF86AudioPrev, exec, playerctl previous
bindm=$mainMod, mouse:272, movewindow
bindm=$mainMod, mouse:273, resizewindow
env=XCURSOR_SIZE,16
env=HYPRCURSOR_SIZE,16
env=XCURSOR_THEME,Bibata-Modern-Classic
env=NIXOS_OZONE_WL,1
env=SDL_VIDEODRIVER,wayland
env=GDK_BACKEND,wayland
env=QT_QPA_PLATFORM,wayland



layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0, match:namespace rofi
layerrule = blur on, match:namespace powermenu
layerrule = ignore_alpha 0, match:namespace powermenu
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0, match:namespace swaync-notification-window
layerrule = blur on, match:namespace swaync-control-center
layerrule = ignore_alpha 0, match:namespace swaync-control-center
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0, match:namespace waybar
layerrule = blur on, match:namespace eww-tray
layerrule = ignore_alpha 0, match:namespace eww-tray

monitor=,preferred,auto,auto

windowrule = match:class .*, suppress_event maximize
windowrule = match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0, no_focus on
windowrule = match:tag FloatingTerm, float on
windowrule = match:tag FloatingTerm, center on
windowrule = match:tag FloatingTerm, size 740 450
windowrule = match:class FloatingTerm, tag +FloatingTerm
windowrule = match:tag ChatGPT, float on
windowrule = match:tag ChatGPT, center on
windowrule = match:tag ChatGPT, size 850 560
windowrule = match:class ChatGPT, tag +ChatGPT
windowrule = match:class ^(Chatgpt|ChatGPT)$, opacity 0.94 override 0.90 override 1.0 override
windowrule = match:class ^(com\.anthropic\.Claude)$, opacity 0.90 override 0.86 override 1.0 override
windowrule = match:class ^(Happ)$, opacity 0.94 override 0.90 override 1.0 override
windowrule = match:tag FloatingTermL, float on
windowrule = match:tag FloatingTermL, center on
windowrule = match:tag FloatingTermL, size 850 560
windowrule = match:class FloatingTermL, tag +FloatingTermL
windowrule = match:tag FloatingTermS, float on
windowrule = match:tag FloatingTermS, center on
windowrule = match:tag FloatingTermS, size 626 325
windowrule = match:class FloatingTermS, tag +FloatingTermS
windowrule = match:tag Calculator, float on
windowrule = match:tag Calculator, center on
windowrule = match:tag Calculator, size 420 200
windowrule = match:class Calculator, tag +Calculator

windowrule = match:class ^(Calculator)$, workspace special:Calculator
windowrule = match:class ^(spotify)$, workspace special:spotify

# Generated from the wallpaper palette; overrides the neutral fallback.
source = ~/.config/current/hypr-colors.conf
