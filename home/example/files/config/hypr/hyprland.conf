$fileManager=nautilus


# Custom apps
source = ~/.config/hyprland/telegram.conf
source = ~/.config/hyprland/nautilus.conf
source = ~/.config/hyprland/firefox.conf

# End Custom apps

$home=$HOME
$mainMod=SUPER
$VsCodeEditor = ~/.local/share/custom/bin/vscode-current-dir.sh
$terminal=alacritty
animations {
  bezier=easeOutQuint,0.23,1,0.32,1
  bezier=easeInOutCubic,0.65,0.05,0.36,1
  bezier=linear,0,0,1,1
  bezier=almostLinear,0.5,0.5,0.75,1.0
  bezier=quick,0.15,0,0.1,1
  animation=global, 1, 10, default
  animation=border, 1, 5.39, easeOutQuint
  animation=windows, 1, 4.79, easeOutQuint
  animation=windowsIn, 1, 4.1, easeOutQuint, popin 87%
  animation=windowsOut, 1, 1.49, linear, popin 87%
  animation=fadeIn, 1, 1.73, almostLinear
  animation=fadeOut, 1, 1.46, almostLinear
  animation=fade, 1, 3.03, quick
  animation=layers, 1, 3.81, easeOutQuint
  animation=layersIn, 1, 4, easeOutQuint, fade
  animation=layersOut, 1, 1.5, linear, fade
  animation=fadeLayersIn, 1, 1.79, almostLinear
  animation=fadeLayersOut, 1, 1.39, almostLinear
  animation=workspaces, 1, 1.94, almostLinear, fade
  animation=workspacesIn, 1, 1.21, almostLinear, fade
  animation=workspacesOut, 1, 1.94, almostLinear, fade
  enabled=yes, please :)
}

cursor {
  inactive_timeout=3
  no_warps=false
}

decoration {
  blur {
    enabled=true
    passes=3
    size=6
    vibrancy=1
  }

  shadow {
    color=rgba(1a1a1a88)
    enabled=true
    range=4
    render_power=3
  }
  active_opacity=1.000000
  inactive_opacity=1.000000
  rounding=10
  rounding_power=2
}


dwindle {
  preserve_split=true
  pseudotile=true
}

general {
  allow_tearing=false
  border_size=2
  col.active_border=rgba(ccccccee)
  col.inactive_border=rgba(00000000)
  gaps_in=5
  gaps_out=5
  layout=dwindle
  resize_on_border=true
}

input {
  follow_mouse=1
  kb_layout=us
  kb_model=
  kb_options=
  kb_rules=
  kb_variant=
  sensitivity=0.2
  touchpad {
    natural_scroll=true
  }
}

master {
  new_status=master
}

misc {
  disable_hyprland_logo=true
  force_default_wallpaper=-1
}

xwayland {
  force_zero_scaling=true
}



### STARTUPS

#Script that toggles between big and small waybar when mouse is at the top of the screen
exec-once=~/.local/share/custom/bin/waybar-auto.sh
exec-once=~/.local/share/custom/bin/session-start.sh
# Recovers last background when hyprland starts
exec-once=swaybg -i $home/.config/current/Wallpapers/Picture.png -m fill &
exec-once=$home/.local/share/custom/bin/sync-sddm-theme.sh

#### END OF STARTUPS 


#### CUSTOM BINDS

# Screenshots/recording
bind=, Print, exec, grim -g "$(slurp)" - | wl-copy
bind=SHIFT, Print, exec, grim - | wl-copy
bind=$mainMod, Print, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png
bind=$mainMod SHIFT, Print, exec, mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png
# bind=$mainMod, R, exec, $home/.local/share/custom/bin/toggle-screenrecord.sh

# Walker
bind=$mainMod, escape, exec, $home/.local/share/custom/bin/walker-menu.sh system
bind=$mainMod MOD5, escape, exec, $home/.local/share/custom/bin/walker-menu.sh power
bind=$mainMod, space, exec, $home/.local/share/custom/bin/walker-menu.sh apps

# Browser
bind=$mainMod, B, exec, zen-beta

# Background cycling
bind=$mainMod CTRL, space, exec, $home/.local/share/custom/bin/cycle-background.sh
bind=$mainMod CTRL SHIFT, space, exec, $home/.local/share/custom/bin/cycle-moving-background.sh

#Terminal tools and widgets

bind=$mainMod, V, exec, $VsCodeEditor
bind=$mainMod, Q, exec, $terminal --class=FloatingTermS -e bash -i -c 'fastfetch; exec bash'
bind=$mainMod, P, exec, $terminal --class=Logo -e bash -i -c '$home/.local/share/custom/bin/logo-printer.sh; exec bash'
bind=$mainMod, O, exec, $terminal --class=FloatingTermL -e bash -ic 'btop'
bind=MOD5, comma, togglespecialworkspace, Calculator
bind=$mainMod, return, exec, $terminal --working-directory=$home
bind=$mainMod, U, exec, $terminal --class=FloatingTermS -e bash -ic 'unimatrix'

# Window management
bind=$mainMod, M, fullscreen, 1
bind=ALT, TAB, cyclenext
bind=$mainMod, H, togglespecialworkspace, magic
bind=$mainMod SHIFT, H, movetoworkspace, special:magic
bind=$mainMod, Y, togglespecialworkspace, spotify
bind=$mainMod, right, resizeactive, 200 0
bind=$mainMod, left, resizeactive, -200 0
bind=$mainMod SHIFT, left, movewindow, l
bind=$mainMod SHIFT, right, movewindow, r
bind=$mainMod SHIFT, up, movewindow, u
bind=$mainMod SHIFT, down, movewindow, d
bind=$mainMod, F, exec, $fileManager
binde=$mainMod, bar, exec, $terminal -e bash -ic 'unimatrix'
binde=$mainMod, TAB, exec, $terminal --working-directory=$home

# Brightness stuff
bindel=, XF86MonBrightnessDown, exec, $home/.local/share/custom/bin/brightness-osd.sh down
bindel=, XF86MonBrightnessUp, exec, $home/.local/share/custom/bin/brightness-osd.sh up


# Audio stuff
bindrl=,XF86AudioRaiseVolume, exec, $home/.local/share/custom/bin/volume-osd.sh up
bindrl=,XF86AudioLowerVolume, exec, $home/.local/share/custom/bin/volume-osd.sh down
bindrl=,XF86AudioMute, exec, $home/.local/share/custom/bin/volume-osd.sh mute
bindrl=,XF86AudioMicMute, exec, $home/.local/share/custom/bin/mic-osd.sh

### END OF CUSTOM BINDS


# bind=$mainMod, V, togglefloating, 
# bind=$mainMod, J, togglesplit,
bind=$mainMod, 1, workspace, 1
bind=$mainMod, 2, workspace, 2
bind=$mainMod, 3, workspace, 3
bind=$mainMod, 4, workspace, 4
bind=$mainMod, 5, workspace, 5
bind=$mainMod, 6, workspace, 6
bind=$mainMod, 7, workspace, 7
bind=$mainMod, 8, workspace, 8
bind=$mainMod, 9, workspace, 9
bind=$mainMod, 0, workspace, 10
bind=$mainMod SHIFT, 1, movetoworkspace, 1
bind=$mainMod SHIFT, 2, movetoworkspace, 2
bind=$mainMod SHIFT, 3, movetoworkspace, 3
bind=$mainMod SHIFT, 4, movetoworkspace, 4
bind=$mainMod SHIFT, 5, movetoworkspace, 5
bind=$mainMod SHIFT, 6, movetoworkspace, 6
bind=$mainMod SHIFT, 7, movetoworkspace, 7
bind=$mainMod SHIFT, 8, movetoworkspace, 8
bind=$mainMod SHIFT, 9, movetoworkspace, 9
bind=$mainMod SHIFT, 0, movetoworkspace, 10
bind=$mainMod, mouse_down, workspace, e+1
bind=$mainMod, mouse_up, workspace, e-1
binde=$mainMod, R, killactive, # super + W
bindl=, XF86AudioNext, exec, playerctl next
bindl=, XF86AudioPause, exec, playerctl play-pause
bindl=, XF86AudioPlay, exec, playerctl play-pause
bindl=, XF86AudioPrev, exec, playerctl previous
bindm=$mainMod, mouse:272, movewindow
bindm=$mainMod, mouse:273, resizewindow
env=XCURSOR_SIZE,16
env=HYPRCURSOR_SIZE,16
env=XCURSOR_THEME,Bibata-Modern-Classic
env=NIXOS_OZONE_WL,1
env=SDL_VIDEODRIVER,wayland
env=GDK_BACKEND,wayland
env=QT_QPA_PLATFORM,wayland



layerrule=blur, walker
layerrule=ignorezero, walker
layerrule=blur, notifications
layerrule=ignorezero, notifications
layerrule=blur, waybar
layerrule=ignorezero, waybar
layerrule=blur, rofi
layerrule=ignorezero, rofi

monitor=,preferred,auto,auto

windowrule=suppressevent maximize, class:.*
windowrule=nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
windowrule=float, tag:Logo
windowrule=center, tag:Logo
windowrule=size 401 375, tag:Logo
windowrule=tag +Logo, class:Logo
windowrule=float, tag:FloatingTerm
windowrule=center, tag:FloatingTerm
windowrule=size 740 450, tag:FloatingTerm
windowrule=tag +FloatingTerm, class:FloatingTerm
windowrule=float, tag:ChatGPT
windowrule=center, tag:ChatGPT
windowrule=size 850 560, tag:ChatGPT
windowrule=tag +ChatGPT, class:ChatGPT
windowrule=opacity 0.94 override 0.90 override 1.0 override, class:^(Chatgpt|ChatGPT)$
windowrule=opacity 0.94 override 0.90 override 1.0 override, class:^(Happ)$
windowrule=float, tag:FloatingTermL
windowrule=center, tag:FloatingTermL
windowrule=size 850 560, tag:FloatingTermL
windowrule=tag +FloatingTermL, class:FloatingTermL
windowrule=float, tag:FloatingTermS
windowrule=center, tag:FloatingTermS
windowrule=size 626 325, tag:FloatingTermS
windowrule=tag +FloatingTermS, class:FloatingTermS
windowrule=float, tag:Calculator
windowrule=center, tag:Calculator
windowrule=size 420 200, tag:Calculator
windowrule=tag +Calculator, class:Calculator

windowrulev2=workspace special:Calculator, class:^(Calculator)$
windowrulev2=workspace special:spotify, class:^(spotify)$
windowrulev2=workspace 2, class:^(firefox|zen|zen-beta)$

# Generated from the wallpaper palette; overrides the neutral fallback.
source = ~/.config/current/hypr-colors.conf
