# Lock screen in the style of the Orbit login screen (SDDM): the same planet,
# orbits and ghosted COSMOS as a still background (orbit-lock.png, rendered
# from the login theme), a big thin clock with superscript minutes, a serif
# date, the name card with a gold password line and mono telemetry.
# The previous lock screen is kept as hyprlock-classic.conf.

$ink = rgba(238, 240, 242, 1.0)
$muted = rgba(138, 144, 153, 1.0)
$gold = rgba(226, 178, 106, 1.0)
$danger = rgba(255, 155, 138, 1.0)
$sans = Montserrat
$serif = EB Garamond
$mono = JetBrainsMono Nerd Font Mono

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = out, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 5, out
    animation = fadeOut, 1, 4, out
    animation = inputFieldDots, 1, 2, out
}

auth {
    fingerprint:enabled = false
}

background {
    monitor =
    path = ~/.config/hypr/orbit-lock.png
    color = rgba(0, 0, 0, 1.0)
}

# ----- Top rail -----
label {
    monitor =
    text = ◐  $USER  //  NIXOS
    color = $ink
    font_family = $mono
    font_size = 10
    position = 108, -48
    halign = left
    valign = top
}
label {
    monitor =
    text = ORBIT 01 — LOCKED
    color = $muted
    font_family = $mono
    font_size = 10
    position = 0, -48
    halign = center
    valign = top
}
label {
    monitor =
    text = cmd[update:60000] awk '{ printf "[ UP %dH %02dM ]", $1 / 3600, ($1 % 3600) / 60 }' /proc/uptime
    color = $muted
    font_family = $mono
    font_size = 10
    position = -108, -48
    halign = right
    valign = top
}
shape {
    monitor =
    size = 1464, 1
    color = rgba(255, 255, 255, 0.13)
    position = 0, -74
    halign = center
    valign = top
}

# ----- Clock -----
label {
    monitor =
    text = cmd[update:1000] date +%H
    color = $ink
    font_family = $sans Light
    font_size = 190
    position = 96, -132
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:1000] date +%M
    color = $ink
    font_family = $sans Medium
    font_size = 64
    position = 400, -178
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:1000] echo "· $(date +%S)"
    color = $gold
    font_family = $mono
    font_size = 11
    position = 404, -282
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_GB.UTF-8 date '+<i>%A, %-d %B</i>'
    color = $ink
    font_family = $serif
    font_size = 30
    position = 110, -400
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:60000] echo "UTC$(date +%:z)  ·  $(date +%Y)  ·  WEEK $(date +%V)"
    color = $muted
    font_family = $mono
    font_size = 10
    position = 112, -462
    halign = left
    valign = top
}

# ----- Name card -----
shape {
    monitor =
    size = 540, 236
    color = rgba(255, 255, 255, 0.04)
    border_size = 1
    border_color = rgba(255, 255, 255, 0.18)
    rounding = 0
    position = 112, 108
    halign = left
    valign = bottom
}
label {
    monitor =
    text = OPERATOR — 01
    color = $gold
    font_family = $mono
    font_size = 9
    position = 145, 300
    halign = left
    valign = bottom
}
label {
    monitor =
    text = $USER
    color = $ink
    font_family = $serif
    font_size = 58
    position = 142, 216
    halign = left
    valign = bottom
}
label {
    monitor =
    text = <i>a quiet signal from the dark side of the planet</i>
    color = $muted
    font_family = $serif
    font_size = 15
    position = 145, 190
    halign = left
    valign = bottom
}
input-field {
    monitor =
    size = 400, 38
    position = 144, 132
    halign = left
    valign = bottom
    outline_thickness = 0
    rounding = 0
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = rgba(0, 0, 0, 0.0)
    check_color = $gold
    fail_color = $danger
    capslock_color = $danger
    font_color = $gold
    font_family = $mono
    placeholder_text = <span foreground="##8a9099" letter_spacing="2000">PASSPHRASE</span>
    fail_text = <span foreground="##ff9b8a" letter_spacing="1500">ACCESS DENIED</span>
    dots_size = 0.28
    dots_spacing = 0.55
    dots_center = false
    dots_rounding = 0
    fade_on_empty = false
    hide_input = false
    swap_font_color = false
}
shape {
    monitor =
    size = 400, 2
    color = $gold
    position = 144, 130
    halign = left
    valign = bottom
}
label {
    monitor =
    text = UNLOCK  ↵
    color = $ink
    font_family = $mono
    font_size = 10
    position = 560, 142
    halign = left
    valign = bottom
}

# ----- Telemetry -----
label {
    monitor =
    text = cmd[update:30000] printf 'TARGET      <span foreground="##eef0f2">DARK PLANET</span>\nBATTERY     <span foreground="##eef0f2">%s%%</span>\nSTATUS      <span foreground="##e2b26a">LOCKED</span>' "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1)"
    color = $muted
    font_family = $mono
    font_size = 10
    position = -112, 108
    halign = right
    valign = bottom
}
