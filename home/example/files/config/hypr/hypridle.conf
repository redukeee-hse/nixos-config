general {
  after_sleep_cmd=hyprctl dispatch dpms on
  before_sleep_cmd=$HOME/.local/share/custom/bin/lock.sh
  lock_cmd=$HOME/.local/share/custom/bin/lock.sh
}

listener {
  on-resume=brightnessctl -r
  on-timeout=brightnessctl -s set 10
  timeout=180
}

listener {
  on-timeout=$HOME/.local/share/custom/bin/lock.sh
  timeout=240
}

listener {
  on-timeout=systemctl suspend
  timeout=300
}
