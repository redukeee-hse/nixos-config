# No idle timers: the screen never dims, locks or sleeps on its own.
# hypridle stays only to lock before sleep (lid close) and wake the screens.
general {
  after_sleep_cmd=hyprctl dispatch dpms on
  before_sleep_cmd=$HOME/.local/share/custom/bin/lock.sh
  lock_cmd=$HOME/.local/share/custom/bin/lock.sh
}
